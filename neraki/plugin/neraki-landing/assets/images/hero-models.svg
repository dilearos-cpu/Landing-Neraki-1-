<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF5F7"/>
      <stop offset="100%" style="stop-color:#F8F7F5"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <ellipse cx="520" cy="500" rx="280" ry="280" fill="#FF85A2" opacity="0.2"/>
  <!-- Model 1 - Pink -->
  <g transform="translate(120, 180)">
    <ellipse cx="80" cy="60" rx="35" ry="40" fill="#FFDBAC"/>
    <rect x="45" y="95" width="70" height="120" rx="8" fill="#FF85A2"/>
    <rect x="50" y="210" width="25" height="180" rx="6" fill="#FF85A2"/>
    <rect x="85" y="210" width="25" height="180" rx="6" fill="#FF85A2"/>
  </g>
  <!-- Model 2 - Black -->
  <g transform="translate(310, 160)">
    <ellipse cx="80" cy="60" rx="35" ry="40" fill="#FFDBAC"/>
    <rect x="45" y="95" width="70" height="120" rx="8" fill="#1A1A1A"/>
    <rect x="50" y="210" width="25" height="180" rx="6" fill="#1A1A1A"/>
    <rect x="85" y="210" width="25" height="180" rx="6" fill="#1A1A1A"/>
  </g>
  <!-- Model 3 - White -->
  <g transform="translate(500, 180)">
    <ellipse cx="80" cy="60" rx="35" ry="40" fill="#FFDBAC"/>
    <rect x="45" y="95" width="70" height="120" rx="8" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/>
    <rect x="50" y="210" width="25" height="180" rx="6" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/>
    <rect x="85" y="210" width="25" height="180" rx="6" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/>
  </g>
  <text x="400" y="950" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#999">Reemplazar con hero-models.png</text>
</svg>
