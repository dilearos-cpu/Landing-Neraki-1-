services:
  - type: web
    name: cod-express
    runtime: node
    rootDir: cod-express-app
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: SHOPIFY_SHOP_DOMAIN
        value: caletzza.myshopify.com
      - key: SHOPIFY_API_VERSION
        value: "2025-01"
      - key: PORT
        value: "3000"
      - key: SHOPIFY_CLIENT_ID
        sync: false
      - key: SHOPIFY_CLIENT_SECRET
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
